services:
  shuxin:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      DATA_DIR: /app/data
      HOST: 0.0.0.0
      PORT: 4321
    ports:
      - "127.0.0.1:4321:4321"
    volumes:
      - shuxin-data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  shuxin-data:
